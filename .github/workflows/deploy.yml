name: EarthTrend CI & Deployment Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Test EarthTrend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Execute Backend Test Suite
        run: |
          cd backend
          pytest tests/ -v

      - name: Verify Vercel Single-Project Artifacts
        run: |
          test -f vercel.json && echo "✓ vercel.json exists"
          test -f api/index.py && echo "✓ api/index.py exists"
          test -f public/index.html && echo "✓ public/index.html exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          echo "EarthTrend Vercel single-project architecture is verified!"
